
services:
  yamcs:
    build: .
    hostname: yamcs
    container_name: grafana-yamcs-demo-yamcs
    command: "mvn -U -Dmaven.wagon.http.retryHandler.count=5 org.yamcs:yamcs-maven-plugin:1.3.5:run"
    environment:
      YAMCS_TC_HOST: simulator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - ../:/yamcs
      - maven-cache:/root/.m2
    ports:
      - "8090:8090"
      - "10015:10015/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quickstart

  simulator:
    build:
      context: ..
      dockerfile: docker/Simulator.Dockerfile
    container_name: grafana-yamcs-demo-simulator
    command:
      - python
      - /demo/simulator.py
      - --tm_host
      - yamcs
      - --tc_host
      - 0.0.0.0
      - --yamcs_url
      - http://yamcs:8090
      - --image_public_base_url
      - http://localhost:8091
      - --image_dir
      - /demo/images
      - --image_rate
      - "2"
    depends_on:
      yamcs:
        condition: service_healthy
    ports:
      - "8091:8091"
      - "10025:10025/udp"
    networks:
      - quickstart
networks:
  quickstart:
    driver: bridge

volumes:
  maven-cache:
